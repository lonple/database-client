# =============================================================================
# DBC 前后端应用 Compose
# =============================================================================
# 流程（打包 → 镜像 → 运行）见文件末尾「构建流程」与 scripts/build-docker-apps.ps1。
#
# 已知不足 / 非生产：密钥目录明文挂载、口令写在 Compose、无资源限额与多副本策略。
#
# 前置：
#   1) scripts\init-docker-workspace.ps1
#   2) docker compose -f deploy/middleware/docker-compose.yml up -d
#   3) scripts\build-docker-apps.ps1          # 后端 bootJar（前端在 Dockerfile 内 npm build）
#   4) docker compose -f deploy/apps/docker-compose.yml up -d --build
#
# 浏览器：http://127.0.0.1:8080
#
# 属性注释约定：与 middleware 重复的键（image/ports/volumes/networks/restart 等）不再重复解释；
# 本文件只注释「应用侧特有」或首次出现的键。
# =============================================================================

# name：本 Compose 项目名（与中间件项目分离，便于独立 up/down）
name: dbc-apps

networks:
  dbc-net:
    # external: true = 不新建，使用中间件已创建的同名网络
    external: true
    name: dbc-net

# x-app-common：YAML 锚点，复用各 Java 服务的公共字段（非 Compose 保留字，仅扩展）
x-app-common: &app-common
  restart: unless-stopped
  # working_dir：容器内进程当前目录（须能解析相对 secrets 路径）
  working_dir: /app
  networks:
    - dbc-net
  # environment 锚点：各服务默认环境变量（可用本服务 environment 覆盖/追加）
  environment: &app-env
    TZ: Asia/Shanghai
    # 密钥目录（挂载宿主机 secrets）
    DBC_SECRETS_DIR: /app/secrets
    # 容器网内 Nacos：用服务名+容器端口 8848（不是宿主机映射的 8000）
    DBC_NACOS_ADDR: nacos:8848
    DBC_REDIS_HOST: redis
    DBC_REDIS_PORT: "6379"
    DBC_REDIS_PASSWORD: ""
    # 服务间调用走 Nacos：HTTP 用服务名（LoadBalancer）；mTLS 用 discovery:// + metadata mtls-port
    # 注意：DBC_MTLS_BASE_URL 仅 usercenter 自身代签用（本机回环），勿写成 discovery://
    DBC_USERCENTER_BASE_URL: http://dbc-usercenter
    DBC_USERCENTER_MTLS_BASE_URL: discovery://dbc-usercenter
    DBC_MANAGE_BASE_URL: http://dbc-manage
    DBC_SQLWORK_BASE_URL: http://dbc-sqlwork
    DBC_AUDIT_MTLS_BASE_URL: discovery://dbc-audit
    DBC_ES_URIS: http://elasticsearch:9200
    # 审计索引环境前缀（避免与本机 dev 索引混用）
    DBC_AUDIT_INDEX_ENV: docker
    DBC_MANAGE_DRIVER_DIR: /app/secrets/manage/drivers

services:
  # ---------- 用户中心：先打包 app.jar，再 build 镜像 ----------
  dbc-usercenter:
    # <<: *app-common = 合并锚点中的公共配置
    <<: *app-common
    # image：构建成功后打上的本地镜像名:标签
    image: dbc-usercenter:0.1.0
    container_name: dbc-usercenter
    # build：告诉 Compose 如何从 Dockerfile 制作镜像（up --build 时执行）
    build:
      # context：构建上下文目录（其中需已有 build/libs/app.jar）
      context: ../../dbc-usercenter
      # dockerfile：相对 context 的 Dockerfile 路径
      dockerfile: Dockerfile
    ports:
      - "8004:8004"
      - "8044:8044"
    environment:
      <<: *app-env
      # 平台库 JDBC（容器内主机名为 postgres）
      DBC_DB_URL: jdbc:postgresql://postgres:5432/postgres?currentSchema=usercenter
      DBC_DB_USER: postgres
      DBC_DB_PASSWORD: root
      DBC_MTLS_PORT: "8044"
      # 自身代签：本机回环（设计约定，不经 Nacos）
      DBC_MTLS_BASE_URL: https://127.0.0.1:8044
    volumes:
      - E:/app/docker/workspace/dbc/secrets:/app/secrets
      - E:/app/docker/workspace/dbc/usercenter/logs:/app/logs

  dbc-manage:
    <<: *app-common
    image: dbc-manage:0.1.0
    container_name: dbc-manage
    build:
      context: ../../dbc-manage
      dockerfile: Dockerfile
    # depends_on：启动顺序提示（不保证对方业务已就绪，仅容器已启动）
    depends_on:
      - dbc-usercenter
    ports:
      - "8006:8006"
    environment:
      <<: *app-env
      DBC_DB_URL: jdbc:postgresql://postgres:5432/postgres?currentSchema=manage
      DBC_DB_USER: postgres
      DBC_DB_PASSWORD: root
    volumes:
      - E:/app/docker/workspace/dbc/secrets:/app/secrets
      - E:/app/docker/workspace/dbc/manage/logs:/app/logs
      - E:/app/docker/workspace/dbc/manage/drivers:/app/secrets/manage/drivers

  dbc-sqlwork:
    <<: *app-common
    image: dbc-sqlwork:0.1.0
    container_name: dbc-sqlwork
    build:
      context: ../../dbc-sqlwork
      dockerfile: Dockerfile
    depends_on:
      - dbc-usercenter
      - dbc-manage
    ports:
      - "8007:8007"
    environment:
      <<: *app-env
    volumes:
      - E:/app/docker/workspace/dbc/secrets:/app/secrets
      - E:/app/docker/workspace/dbc/sqlwork/logs:/app/logs
    # 进程内会话/连接池：学习环境固定单实例，勿随意提高 replicas

  dbc-audit:
    <<: *app-common
    image: dbc-audit:0.1.0
    container_name: dbc-audit
    build:
      context: ../../dbc-audit
      dockerfile: Dockerfile
    depends_on:
      - dbc-usercenter
    ports:
      - "8008:8008"
      - "8048:8048"
    environment:
      <<: *app-env
      DBC_AUDIT_MTLS_PORT: "8048"
    volumes:
      - E:/app/docker/workspace/dbc/secrets:/app/secrets
      - E:/app/docker/workspace/dbc/audit/logs:/app/logs

  dbc-gateway:
    <<: *app-common
    image: dbc-gateway:0.1.0
    container_name: dbc-gateway
    build:
      context: ../../dbc-gateway
      dockerfile: Dockerfile
    depends_on:
      - dbc-usercenter
      - dbc-manage
      - dbc-sqlwork
      - dbc-audit
    ports:
      - "8003:8003"
    environment:
      <<: *app-env
    volumes:
      - E:/app/docker/workspace/dbc/gateway/logs:/app/logs

  # ---------- 前端：Dockerfile 内 npm build，产物打进 nginx 镜像 ----------
  dbc-front:
    image: dbc-front:0.1.0
    container_name: dbc-front
    build:
      context: ../../dbc-front
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      - dbc-gateway
    ports:
      # 对外统一入口 8080 → 容器 nginx 80
      - "8080:80"
    volumes:
      # 仅挂配置便于改反代；静态资源在镜像内（不挂 html，避免空目录覆盖镜像）
      - E:/app/docker/workspace/dbc/front/conf/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - dbc-net

# =============================================================================
# 构建流程（代码落点）
# =============================================================================
# 1) 后端打包
#    scripts/build-docker-apps.ps1
#      → scripts/publish-dbc-client.ps1   # dbc-client 发布到 mavenLocal
#      → 各 dbc-*/gradlew bootJar        # 产出 dbc-*/build/libs/app.jar
# 2) 制作镜像并运行
#    docker compose -f deploy/apps/docker-compose.yml up -d --build
#      → 读各服务 Dockerfile
#           后端：COPY build/libs/app.jar → eclipse-temurin:21.0.12_8-jre 运行
#           前端：dbc-front/Dockerfile 多阶段 npm run build → nginx:stable-alpine
# 3) 中间件不打包业务代码，直接用官方镜像
#    deploy/middleware/docker-compose.yml
# =============================================================================
