server {
    listen 80;
    server_name _;

    # Align with manage driver upload limit (nginx default 1m causes HTTP 413)
    client_max_body_size 64m;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Docker embedded DNS. A literal proxy_pass hostname is resolved once at
    # start; after dbc-gateway is recreated its IP changes and nginx keeps
    # dialing the old address (connection refused → 502). A variable forces
    # re-resolution on each request.
    resolver 127.0.0.11 valid=10s ipv6=off;

    location /dbc- {
        client_max_body_size 64m;
        set $dbc_gateway_upstream http://dbc-gateway:8003;
        proxy_pass $dbc_gateway_upstream;
        proxy_http_version 1.1;
        proxy_request_buffering off;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }
}
