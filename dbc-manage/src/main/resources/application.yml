server:
  port: 8006

spring:
  application:
    name: dbc-manage
  cloud:
    nacos:
      discovery:
        server-addr: ${DBC_NACOS_ADDR:127.0.0.1:8000}
  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    url: ${DBC_DB_URL:jdbc:postgresql://127.0.0.1:5432/postgres?currentSchema=manage}
    username: ${DBC_DB_USER:postgres}
    password: ${DBC_DB_PASSWORD:root}
    driver-class-name: org.postgresql.Driver
    druid:
      initial-size: 2
      min-idle: 2
      max-active: 20
      max-wait: 10000
      time-between-eviction-runs-millis: 60000
      min-evictable-idle-time-millis: 300000
      validation-query: SELECT 1
      test-while-idle: true
      test-on-borrow: false
      test-on-return: false
      # 生产默认关闭监控页，避免未鉴权暴露
      stat-view-servlet:
        enabled: false
      web-stat-filter:
        enabled: false
  flyway:
    enabled: true
    schemas: manage
    default-schema: manage
    locations: classpath:db/migration
  data:
    redis:
      host: ${DBC_REDIS_HOST:127.0.0.1}
      port: ${DBC_REDIS_PORT:6379}
      password: ${DBC_REDIS_PASSWORD:}
  servlet:
    multipart:
      max-file-size: 64MB
      max-request-size: 64MB

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

dbc:
  jwt:
    expire-hours: 8
  secrets:
    # 相对进程工作目录；IDE / bootRun 均应以仓库根为工作目录
    dir: ${DBC_SECRETS_DIR:secrets}
  manage:
    driver-dir: ${DBC_MANAGE_DRIVER_DIR:secrets/manage/drivers}
    usercenter-base-url: ${DBC_USERCENTER_BASE_URL:http://dbc-usercenter}
    usercenter-mtls-base-url: ${DBC_USERCENTER_MTLS_BASE_URL:discovery://dbc-usercenter}
    sqlwork-base-url: ${DBC_SQLWORK_BASE_URL:http://dbc-sqlwork}
    client-id: dbc-manage
    # 驱动 JAR 最大字节数（默认 64MB）
    driver-max-bytes: 67108864
    authz-cache:
      enabled: true
      assets-ttl-seconds: 1200
      user-ttl-seconds: 600
      ver-ttl-seconds: 86400
  audit:
    client:
      enabled: true
      mtls-base-url: ${DBC_AUDIT_MTLS_BASE_URL:discovery://dbc-audit}
      client-id: dbc-manage
      secrets-dir: ${DBC_SECRETS_DIR:secrets}

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    com.lyj.dbc.manage: INFO
