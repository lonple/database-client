server:
  port: 8003

spring:
  application:
    name: dbc-gateway
  # 与 manage 驱动上传 64MB 对齐，避免网关缓冲截断大 body
  codec:
    max-in-memory-size: 64MB
  data:
    redis:
      host: ${DBC_REDIS_HOST:127.0.0.1}
      port: ${DBC_REDIS_PORT:6379}
      password: ${DBC_REDIS_PASSWORD:}
  cloud:
    nacos:
      discovery:
        server-addr: ${DBC_NACOS_ADDR:127.0.0.1:8000}
    gateway:
      globalcors:
        cors-configurations:
          '[/**]':
            # 生产通过部署配置覆盖；禁止使用 *
            allowedOriginPatterns:
              - "http://127.0.0.1:8005"
              - "http://localhost:8005"
              - "http://127.0.0.1:8080"
              - "http://localhost:8080"
            allowedMethods: "*"
            allowedHeaders: "*"
            allowCredentials: true
      discovery:
        locator:
          enabled: false
      routes:
        - id: dbc-usercenter
          uri: lb://dbc-usercenter
          predicates:
            - Path=/dbc-usercenter/**
          filters:
            - StripPrefix=1
        - id: dbc-manage
          uri: lb://dbc-manage
          predicates:
            - Path=/dbc-manage/**
          filters:
            - StripPrefix=1
        - id: dbc-sqlwork
          uri: lb://dbc-sqlwork
          predicates:
            - Path=/dbc-sqlwork/**
          filters:
            - StripPrefix=1
        - id: dbc-audit
          uri: lb://dbc-audit
          predicates:
            - Path=/dbc-audit/**
          filters:
            - StripPrefix=1
        - id: dbc-askdata
          uri: lb://dbc-askdata
          predicates:
            - Path=/dbc-askdata/**
          filters:
            - StripPrefix=1
        - id: dbc-knowledge
          uri: lb://dbc-knowledge
          predicates:
            - Path=/dbc-knowledge/**
          filters:
            - StripPrefix=1
        - id: dbc-graph
          uri: lb://dbc-graph
          predicates:
            - Path=/dbc-graph/**
          filters:
            - StripPrefix=1

dbc:
  secrets:
    dir: ${DBC_SECRETS_DIR:secrets}

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    org.springframework.cloud.gateway: INFO
