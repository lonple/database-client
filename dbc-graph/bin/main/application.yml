server:
  port: 8011

spring:
  application:
    name: dbc-graph
  data:
    redis:
      host: ${DBC_REDIS_HOST:127.0.0.1}
      port: ${DBC_REDIS_PORT:6379}
      password: ${DBC_REDIS_PASSWORD:}
  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    driver-class-name: org.postgresql.Driver
    url: ${DBC_DB_URL:jdbc:postgresql://127.0.0.1:5432/postgres?currentSchema=graph}
    username: ${DBC_DB_USER:postgres}
    password: ${DBC_DB_PASSWORD:root}
  flyway:
    enabled: true
    schemas: graph
    default-schema: graph
    create-schemas: true
    baseline-on-migrate: true
    locations: classpath:db/migration

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    db-config:
      id-type: auto

dbc:
  jwt:
    expire-hours: 8
  secrets:
    dir: ${DBC_SECRETS_DIR:secrets}
  nacos:
    server-addr: ${DBC_NACOS_ADDR:127.0.0.1:8000}
  graph:
    neo4j:
      uri: ${DBC_NEO4J_URI:bolt://127.0.0.1:7687}
      username: ${DBC_NEO4J_USER:neo4j}
      password: ${DBC_NEO4J_PASSWORD:changeme}
    seed:
      company-table-relations: ${DBC_GRAPH_SEED_COMPANY_TABLES:false}

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  charset:
    console: UTF-8
    file: UTF-8
  level:
    com.lyj.dbc.graph: INFO
